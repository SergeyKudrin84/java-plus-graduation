server:
  port: 0

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:./infra/config-repo
            - file:./infra/config-repo/core
            - file:./infra/config-repo/stats
            - file:./infra/config-repo/infra
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/