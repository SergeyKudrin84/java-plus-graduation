# HTTP server
server.port=0

# gRPC server
grpc.server.port=0

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:6501/stats_db
spring.datasource.username=dbuser
spring.datasource.password=12345

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.transaction=INFO

analyzer.kafka.consumer.group-id=analyzer
analyzer.kafka.consumer.auto-offset-reset=earliest
analyzer.kafka.consumer.poll-timeout=100ms

analyzer.recommendations.neighbors-limit=10
