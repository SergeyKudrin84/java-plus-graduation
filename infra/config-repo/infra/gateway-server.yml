server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/**