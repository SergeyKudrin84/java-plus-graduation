server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events,/events/**,/users/{userId}/events,/users/{userId}/events/**,/admin/events,/admin/events/**

        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/**