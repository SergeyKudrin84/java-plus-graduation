server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events,/events/**,/users/{userId}/events,/users/{userId}/events/**,/admin/events,/admin/events/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests,/users/{userId}/requests/**

        - id: compilation-service
          uri: lb://compilation-service
          predicates:
            predicates:
              - Path=/categories,/categories/**,/admin/categories,/admin/categories/**,/compilations,/compilations/**,/admin/compilations,/admin/compilations/**